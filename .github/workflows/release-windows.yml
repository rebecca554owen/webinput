name: Release Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (必须以v开头，例如: v1.0.0, v2.1.3, v1.0.0-beta, v3.2.1-rc1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows
    runs-on: windows-latest
    steps:
      - name: Validate version input
        run: |
          if ("${{ github.event.inputs.version }}" -notmatch "^v.*") {
            Write-Host "错误：版本号格式不正确，必须以 v 开头 (例如: v1.0.0, v2.1.3, v1.0.0-beta, v3.2.1-rc1)"
            exit 1
          }
          Write-Host "版本号验证通过：${{ github.event.inputs.version }}"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Update version in wails.json
        run: |
          $version = "${{ github.event.inputs.version }}" -replace "^v", ""
          (Get-Content wails.json) -replace '"productVersion":\s*"[^"]*"', "`"productVersion`": `"$version`"" | Set-Content wails.json

      - name: Build Wails application
        run: |
          # 设置前端构建版本环境变量并构建
          $env:VITE_VERSION="${{ github.event.inputs.version }}"
          wails build -platform windows/amd64 -clean

      - name: Get build time (UTC+8)
        id: time
        run: |
          $time = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, "China Standard Time")
          echo "build_time=$($time.ToString('yyyy-MM-dd HH:mm:ss (UTC+8)'))" >> $env:GITHUB_OUTPUT

      - name: Move build artifact to root
        run: |
          # 将构建产物移动到根目录以便发布
          Copy-Item build/bin/webinput.exe -Destination webinput.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: |
            ## 🚀 Release ${{ github.event.inputs.version }}

            **下载**: [webinput.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/webinput.exe)

            **使用说明**:
            1. 下载 `webinput.exe`
            2. 双击运行即可（单文件，无需其他依赖）

            *构建时间: ${{ steps.time.outputs.build_time }}*
            *提交: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})*
          draft: false
          prerelease: ${{ contains(github.event.inputs.version, 'beta') || contains(github.event.inputs.version, 'rc') || contains(github.event.inputs.version, 'alpha') || contains(github.event.inputs.version, 'dev') || contains(github.event.inputs.version, 'test') }}
          files: |
            webinput.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
