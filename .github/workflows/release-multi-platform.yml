name: Release Multi-Platform Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (必须以v开头，例如: v1.0.0, v2.1.3, v1.0.0-beta, v3.2.1-rc1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            bundle_name: nsis
            asset_name: webinput-windows-amd64.exe
          - os: macos-latest
            platform: darwin/amd64
            bundle_name: dmg
            asset_name: webinput-darwin-amd64.dmg
          - os: macos-latest
            platform: darwin/arm64
            bundle_name: dmg
            asset_name: webinput-darwin-arm64.dmg
          - os: ubuntu-latest
            platform: linux/amd64
            bundle_name: appimage
            asset_name: webinput-linux-amd64.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Update version in tauri.conf.json (Windows)
        if: runner.os == 'Windows'
        run: |
          $version = "${{ github.event.inputs.version }}" -replace "^v", ""
          $json = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $json.version = $version
          $json | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json

      - name: Update version in tauri.conf.json (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          sed -i "s/\"version\":\s*\"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json

      - name: Update version in Cargo.toml (Windows)
        if: runner.os == 'Windows'
        run: |
          $version = "${{ github.event.inputs.version }}" -replace "^v", ""
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$version`"" | Set-Content src-tauri/Cargo.toml

      - name: Update version in Cargo.toml (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Build Tauri application (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VITE_VERSION="${{ github.event.inputs.version }}"
          npm run tauri:build

      - name: Build Tauri application (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          export VITE_VERSION="${{ github.event.inputs.version }}"
          npm run tauri:build

      - name: Move build artifact to root (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item src-tauri/target/release/bundle/${{ matrix.bundle_name }}/*.exe -Destination ${{ matrix.asset_name }}

      - name: Move build artifact to root (macOS)
        if: runner.os == 'macOS'
        run: |
          BUNDLE_PATH=$(find src-tauri/target/release/bundle -name "*.dmg" | head -n 1)
          cp "$BUNDLE_PATH" "${{ matrix.asset_name }}"

      - name: Move build artifact to root (Linux)
        if: runner.os == 'Linux'
        run: |
          BUNDLE_PATH=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -n 1)
          cp "$BUNDLE_PATH" "${{ matrix.asset_name }}"
          chmod +x "${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get build time (UTC+8)
        id: time
        run: |
          time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S (UTC+8)')
          echo "build_time=$time" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: |
            ## 🚀 Release ${{ github.event.inputs.version }}

            **下载链接**:

            | 平台 | 架构 | 下载链接 |
            |------|------|----------|
            | Windows | amd64 | [webinput-windows-amd64.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/webinput-windows-amd64.exe) |
            | macOS | amd64 (Intel) | [webinput-darwin-amd64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/webinput-darwin-amd64.dmg) |
            | macOS | arm64 (Apple Silicon) | [webinput-darwin-arm64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/webinput-darwin-arm64.dmg) |
            | Linux | amd64 | [webinput-linux-amd64.AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/webinput-linux-amd64.AppImage) |

            **使用说明**:
            - **Windows**: 下载 `webinput-windows-amd64.exe`，双击运行
            - **macOS**: 下载对应架构的 `.dmg` 文件，拖拽到 Applications 文件夹
            - **Linux**: 下载 `webinput-linux-amd64.AppImage`，在终端运行 `chmod +x webinput-linux-amd64.AppImage` 后执行

            *构建时间: ${{ steps.time.outputs.build_time }}*
            *提交: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})*
          draft: false
          prerelease: ${{ contains(github.event.inputs.version, 'beta') || contains(github.event.inputs.version, 'rc') || contains(github.event.inputs.version, 'alpha') || contains(github.event.inputs.version, 'dev') || contains(github.event.inputs.version, 'test') }}
          files: ./artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
