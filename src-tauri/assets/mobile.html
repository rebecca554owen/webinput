<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebInput</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            text-align: center;
            background-color: #f5f5f7;
            color: #333;
        }
        h2 { margin-bottom: 20px; font-weight: 600; }
        .input-group { margin-bottom: 15px; }
        textarea {
            width: 100%; padding: 15px; font-size: 16px; border-radius: 12px;
            border: 1px solid #d1d1d6; box-sizing: border-box; outline: none;
            background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: border-color 0.2s;
            min-height: 120px; resize: vertical; font-family: inherit;
        }
        textarea:focus { border-color: #007AFF; }
        .button-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button {
            flex: 1; padding: 15px; font-size: 18px; color: white;
            border: none; border-radius: 12px; cursor: pointer; font-weight:  600;
            transition: background-color 0.1s, transform 0.1s;
        }
        button#sendBtn {
            background-color: #007AFF;
            box-shadow: 0 4px 6px rgba(0,122,255,0.2);
        }
        button#sendBtn:active { background-color: #0056b3; transform: scale(0.98); }
        button#clearBtn {
            background-color: #8e8e93;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button#clearBtn:active { background-color: #636366; transform: scale(0.98); }
        #status { margin-top: 10px; height: 20px; font-size: 14px; color: #34c759; font-weight: 500;}
        .history-container { margin-top: 30px; text-align: left; }
        .history-header {
            font-size: 14px; color: #888; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .clear-btn { color: #ff3b30; cursor: pointer; font-size: 12px; }
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item {
            background: #fff; padding: 12px; margin-bottom: 8px; border-radius: 8px;
            border: 1px solid #e5e5ea; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
            transition: background 0.1s;
        }
        .history-item:active { background: #f0f0f0; }
        .history-text {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 85%; font-size: 14px;
        }
        .history-arrow { color: #c7c7cc; font-size: 18px; }

        @media (max-width: 768px) {
            body { padding: 15px; }
            h2 { font-size: 20px; }
            button { padding: 12px; font-size: 16px; }
        }

        @media (max-width: 375px) {
            body { padding: 10px; }
            .button-group { flex-direction: column; gap: 8px; }
            button { width: 100%; }
        }

        @media (hover: none) and (pointer: coarse) {
            button, .history-item { min-height: 44px; }
            textarea { font-size: 16px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 10px; }
            h2 { margin-bottom: 10px; font-size: 18px; }
            textarea { min-height: 60px; }
        }
    </style>
</head>
<body>
    <h2>电脑远程输入板</h2>

    <div class="input-group">
        <textarea id="textInput" placeholder="输入文字，实时预览到桌面..." autofocus autocomplete="off"></textarea>
    </div>
    <div class="button-group">
        <button id="clearBtn" onclick="handleClear()">清空</button>
        <button id="sendBtn" onclick="handleSend()">立即发送</button>
    </div>

    <div id="status"></div>
    <div class="history-container">
        <div class="history-header">
            <span>最近发送记录 (最多20条)</span>
            <span class="clear-btn" onclick="clearHistory()">清空</span>
        </div>
        <ul id="historyList" class="history-list"></ul>
    </div>
    <script>
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let deviceName = '未知设备';
            let deviceId = localStorage.getItem('webinput_device_id');

            if (!deviceId) {
                deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('webinput_device_id', deviceId);
            }

            if (/iPhone/.test(ua)) {
                deviceName = 'iPhone';
            } else if (/iPad/.test(ua)) {
                deviceName = 'iPad';
            } else if (/Android/.test(ua)) {
                if (/Mi|Redmi|Xiaomi/i.test(ua)) {
                    deviceName = '小米';
                } else if (/HUAWEI|Honor|Magic/i.test(ua)) {
                    deviceName = '华为';
                } else if (/OPPO|Realme|OnePlus/i.test(ua)) {
                    deviceName = 'OPPO';
                } else if (/vivo|iQOO/i.test(ua)) {
                    deviceName = 'vivo';
                } else if (/Samsung/i.test(ua)) {
                    deviceName = '三星';
                } else if (/Pixel/i.test(ua)) {
                    deviceName = 'Google Pixel';
                } else {
                    deviceName = 'Android';
                }
            } else if (/Windows/.test(ua)) {
                deviceName = 'Windows PC';
            } else if (/Macintosh/.test(ua)) {
                deviceName = 'Mac';
            } else if (/Linux/.test(ua)) {
                deviceName = 'Linux PC';
            }

            return { deviceName, deviceId };
        }

        const deviceInfo = getDeviceInfo();
        let clientIP = '';

        let reconnectTimer = null;

        function connectWebSocket() {
            const ws = new WebSocket('ws://' + window.location.host + '/ws?type=mobile');

            ws.onopen = function() {
                console.log('WebSocket 已连接');
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                try {
                    ws.send(JSON.stringify({
                        type: 'connect',
                        data: {
                            type: 'mobile',
                            device_name: deviceInfo.deviceName,
                            device_id: deviceInfo.deviceId
                        },
                        timestamp: Date.now()
                    }));

                    ws.send(JSON.stringify({
                        type: 'preview',
                        data: {
                            text: '',
                            length: 0,
                            device_name: deviceInfo.deviceName,
                            device_id: deviceInfo.deviceId,
                            client_ip: clientIP
                        },
                        timestamp: Date.now()
                    }));
                } catch (e) {
                    console.error('发送连接消息失败:', e);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket 错误:', error);
            };

            ws.onclose = function(event) {
                console.log('WebSocket 已断开');
                if (!reconnectTimer) {
                    reconnectTimer = setTimeout(() => {
                        connectWebSocket();
                    }, 3000);
                }
            };

            ws.addEventListener('message', function(event) {
                const msg = JSON.parse(event.data);
                if (msg.type === 'clear') {
                    textInput.value = '';
                } else if (msg.type === 'sync') {
                    if (msg.data && msg.data.text !== undefined) {
                        const start = textInput.selectionStart;
                        const end = textInput.selectionEnd;
                        textInput.value = msg.data.text;
                        if (start <= msg.data.text.length && end <= msg.data.text.length) {
                            textInput.setSelectionRange(start, end);
                        }
                    }
                } else if (msg.type === 'connect') {
                    if (msg.data && msg.data.client_ip) {
                        clientIP = msg.data.client_ip;
                        console.log('客户端IP:', clientIP);
                    }
                }
            });

            return ws;
        }

        let ws = connectWebSocket();

        const textInput = document.getElementById('textInput');
        const status = document.getElementById('status');
        const historyList = document.getElementById('historyList');
        const MAX_HISTORY = 20;

        window.onload = function() { renderHistory(); }

        textInput.addEventListener("input", function() {
            const text = textInput.value;
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'preview',
                    data: {
                        text: text,
                        length: text.length,
                        device_name: deviceInfo.deviceName,
                        device_id: deviceInfo.deviceId,
                        client_ip: clientIP
                    },
                    timestamp: Date.now()
                }));
            }
        });

        function handleSend() {
            const text = textInput.value.trim();
            if (!text) return;
            saveToHistory(text);
            sendRequest(text, true);
        }

        function handleClear() {
            textInput.value = '';
            textInput.focus();
        }

        function sendRequest(text, clearAfter) {
            status.innerText = "发送中...";
            status.style.color = "#888";
            fetch('/type', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    status.innerText = "✓ 已发送";
                    status.style.color = "#34c759";

                    if (typeof ws !== 'undefined' && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'history',
                            data: {
                                text: text,
                                device_name: deviceInfo.deviceName,
                                device_id: deviceInfo.deviceId,
                                client_ip: clientIP
                            },
                            timestamp: Date.now()
                        }));

                        ws.send(JSON.stringify({
                            type: 'clear',
                            data: {
                                device_id: deviceInfo.deviceId
                            },
                            timestamp: Date.now()
                        }));
                    }

                    if (clearAfter) {
                        textInput.value = '';
                    }
                    setTimeout(() => status.innerText = "", 1500);
                } else { throw new Error("Server error"); }
            })
            .catch(err => {
                status.innerText = "✕ 发送失败";
                status.style.color = "#ff3b30";
            });
        }

        function getHistory() {
            const stored = localStorage.getItem('typeHistory');
            return stored ? JSON.parse(stored) : [];
        }

        function saveToHistory(text) {
            let history = getHistory();
            history = history.filter(item => item !== text);
            history.unshift(text);
            if (history.length > MAX_HISTORY) { history = history.slice(0, MAX_HISTORY); }
            localStorage.setItem('typeHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = getHistory();
            historyList.innerHTML = '';
            history.forEach(text => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.onclick = () => {
                    textInput.value = text;
                    handleSend();
                };
                li.innerHTML = '<span class="history-text">' + escapeHtml(text) + '</span><span class="history-arrow">⤶</span>';
                historyList.appendChild(li);
            });
        }

        function clearHistory() { localStorage.removeItem('typeHistory'); renderHistory(); }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
