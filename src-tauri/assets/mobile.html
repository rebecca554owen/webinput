<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WebInput</title>
    <style>
        :root {
            --bg-gradient-light: linear-gradient(145deg, #e8f4fc 0%, #f0f4f8 50%, #ffffff 100%);
            --bg-gradient-dark: linear-gradient(145deg, #0a0a0f 0%, #141419 50%, #1a1a1f 100%);
            --glow-1-light: radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.25), transparent 60%);
            --glow-1-dark: radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.15), transparent 60%);
            --glow-2-light: radial-gradient(ellipse at 80% 80%, rgba(147, 197, 253, 0.2), transparent 55%);
            --glow-2-dark: radial-gradient(ellipse at 80% 80%, rgba(71, 85, 105, 0.12), transparent 55%);
            --glass-bg-light: rgba(255, 255, 255, 0.85);
            --glass-bg-dark: rgba(23, 23, 28, 0.85);
            --glass-border-light: rgba(255, 255, 255, 0.8);
            --glass-border-dark: rgba(255, 255, 255, 0.08);
            --text-primary-light: #1a1a2e;
            --text-primary-dark: #f8f9fc;
            --text-secondary-light: #64748b;
            --text-secondary-dark: #94a3b8;
            --input-bg-light: rgba(255, 255, 255, 0.6);
            --input-bg-dark: rgba(30, 30, 38, 0.5);
            --btn-primary-bg: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            --btn-primary-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
            --btn-secondary-bg-light: rgba(255, 255, 255, 0.5);
            --btn-secondary-bg-dark: rgba(40, 40, 50, 0.6);
            --btn-secondary-border-light: rgba(255, 255, 255, 0.6);
            --btn-secondary-border-dark: rgba(255, 255, 255, 0.1);
            --history-bg-light: rgba(255, 255, 255, 0.5);
            --history-bg-dark: rgba(35, 35, 45, 0.5);
            --shadow-glass-light: 0 8px 32px rgba(148, 163, 184, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.6);
            --shadow-glass-dark: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            --shadow-elevation-light: 0 2px 8px rgba(148, 163, 184, 0.2), 0 4px 16px rgba(148, 163, 184, 0.1);
            --shadow-elevation-dark: 0 2px 8px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        [data-theme="dark"] {
            --bg-gradient: var(--bg-gradient-dark);
            --glow-1: var(--glow-1-dark);
            --glow-2: var(--glow-2-dark);
            --glass-bg: var(--glass-bg-dark);
            --glass-border: var(--glass-border-dark);
            --text-primary: var(--text-primary-dark);
            --text-secondary: var(--text-secondary-dark);
            --input-bg: var(--input-bg-dark);
            --btn-secondary-bg: var(--btn-secondary-bg-dark);
            --btn-secondary-border: var(--btn-secondary-border-dark);
            --history-bg: var(--history-bg-dark);
            --shadow-glass: var(--shadow-glass-dark);
            --shadow-elevation: var(--shadow-elevation-dark);
        }

        [data-theme="light"] {
            --bg-gradient: var(--bg-gradient-light);
            --glow-1: var(--glow-1-light);
            --glow-2: var(--glow-2-light);
            --glass-bg: var(--glass-bg-light);
            --glass-border: var(--glass-border-light);
            --text-primary: var(--text-primary-light);
            --text-secondary: var(--text-secondary-light);
            --input-bg: var(--input-bg-light);
            --btn-secondary-bg: var(--btn-secondary-bg-light);
            --btn-secondary-border: var(--btn-secondary-border-light);
            --history-bg: var(--history-bg-light);
            --shadow-glass: var(--shadow-glass-light);
            --shadow-elevation: var(--shadow-elevation-light);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            position: relative;
            transition: background 0.5s ease;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.5s ease;
        }

        body::before {
            top: -15%;
            left: -15%;
            width: 70vw;
            height: 70vw;
            background: var(--glow-1);
            filter: blur(100px);
            opacity: 0.8;
        }

        body::after {
            bottom: -15%;
            right: -15%;
            width: 60vw;
            height: 60vw;
            background: var(--glow-2);
            filter: blur(100px);
            opacity: 0.7;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .theme-switcher {
            display: flex;
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1.5px solid var(--glass-border);
            border-radius: 14px;
            padding: 4px;
            gap: 4px;
            box-shadow: var(--shadow-elevation);
        }

        .theme-btn {
            background: transparent;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .theme-btn:active {
            transform: scale(0.92);
        }

        .theme-btn.active {
            background: var(--btn-primary-bg);
            color: white;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        .input-group {
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1.5px solid var(--glass-border);
            border-radius: 18px;
            box-shadow: var(--shadow-glass);
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            min-height: 140px;
            resize: vertical;
        }

        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12), var(--shadow-glass);
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
            min-height: 54px;
        }

        button:active {
            transform: scale(0.96);
        }

        #sendBtn {
            background: var(--btn-primary-bg);
            color: white;
            border: none;
            box-shadow: var(--btn-primary-shadow);
            font-weight: 700;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        #sendBtn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
            border-radius: 14px;
        }

        #sendBtn:active {
            transform: scale(0.96);
            box-shadow: var(--btn-primary-shadow), 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        #clearBtn {
            background: var(--btn-secondary-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1.5px solid var(--btn-secondary-border);
            color: var(--text-primary);
            font-weight: 600;
        }

        #clearBtn:active {
            transform: scale(0.96);
            background: var(--glass-bg);
        }

        #status {
            margin-top: 12px;
            height: 20px;
            font-size: 14px;
            color: #34c759;
            font-weight: 500;
            text-align: center;
        }

        .history-container {
            margin-top: 24px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-title {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .clear-btn {
            color: #ff3b30;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .clear-btn:active {
            background: var(--input-bg);
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            padding: 16px 18px;
            background: var(--history-bg);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1.5px solid var(--glass-border);
            border-radius: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-elevation);
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
            cursor: pointer;
            min-height: 54px;
        }

        .history-item:active {
            background: var(--glass-bg);
            transform: scale(0.98);
            box-shadow: var(--shadow-glass);
        }

        .history-text {
            flex: 1;
            font-size: 16px;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 12px;
        }

        .history-arrow {
            color: var(--text-secondary);
            font-size: 18px;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            body {
                padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            }

            h2 {
                font-size: 22px;
            }

            .button-group {
                gap: 8px;
            }

            button {
                padding: 14px;
                font-size: 16px;
            }

            textarea {
                padding: 14px;
                font-size: 17px;
            }
        }

        @media (max-width: 375px) {
            .button-group {
                flex-direction: column;
                gap: 8px;
            }

            button {
                width: 100%;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 10px;
            }

            .header {
                margin-bottom: 12px;
            }

            h2 {
                font-size: 18px;
            }

            textarea {
                min-height: 60px;
                padding: 10px;
            }

            button {
                padding: 10px;
                font-size: 15px;
                min-height: 44px;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            button, .history-item {
                min-height: 48px;
            }

            textarea {
                font-size: 16px;
            }
        }
    </style>
</head>
<body data-theme="light">
    <div class="wrapper">
        <div class="header">
            <h2>电脑远程输入板</h2>
            <div class="theme-switcher">
                <button class="theme-btn" data-theme="light" title="浅色模式">◐</button>
                <button class="theme-btn" data-theme="dark" title="深色模式">◑</button>
                <button class="theme-btn active" data-theme="auto" title="跟随系统">◕</button>
            </div>
        </div>

        <div class="input-group">
            <textarea id="textInput" placeholder="输入文字，实时预览到桌面..." autofocus autocomplete="off"></textarea>
        </div>

        <div class="button-group">
            <button id="clearBtn" onclick="handleClear()">清空</button>
            <button id="sendBtn" onclick="handleSend()">立即发送</button>
        </div>

        <div id="status"></div>

        <div class="history-container">
            <div class="history-header">
                <span class="history-title">最近发送记录 (最多20条)</span>
                <span class="clear-btn" onclick="clearHistory()">清空</span>
            </div>
            <ul id="historyList" class="history-list"></ul>
        </div>
    </div>

    <script>
        const THEME = {
            LIGHT: 'light',
            DARK: 'dark',
            AUTO: 'auto'
        };

        const themeButtons = document.querySelectorAll('.theme-btn');
        let currentTheme = localStorage.getItem('webinput_mobile_theme') || THEME.AUTO;

        function applyTheme(theme) {
            const resolved = theme === THEME.AUTO
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? THEME.DARK : THEME.LIGHT)
                : theme;

            document.body.setAttribute('data-theme', resolved);

            themeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
        }

        themeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                currentTheme = btn.dataset.theme;
                localStorage.setItem('webinput_mobile_theme', currentTheme);
                applyTheme(currentTheme);
            });
        });

        applyTheme(currentTheme);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (currentTheme === THEME.AUTO) {
                applyTheme(THEME.AUTO);
            }
        });

        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let deviceName = '未知设备';
            let deviceId = localStorage.getItem('webinput_device_id');

            if (!deviceId) {
                deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('webinput_device_id', deviceId);
            }

            if (/iPhone/.test(ua)) {
                deviceName = 'iPhone';
            } else if (/iPad/.test(ua)) {
                deviceName = 'iPad';
            } else if (/Android/.test(ua)) {
                if (/Mi|Redmi|Xiaomi/i.test(ua)) {
                    deviceName = '小米';
                } else if (/HUAWEI|Honor|Magic/i.test(ua)) {
                    deviceName = '华为';
                } else if (/OPPO|Realme|OnePlus/i.test(ua)) {
                    deviceName = 'OPPO';
                } else if (/vivo|iQOO/i.test(ua)) {
                    deviceName = 'vivo';
                } else if (/Samsung/i.test(ua)) {
                    deviceName = '三星';
                } else if (/Pixel/i.test(ua)) {
                    deviceName = 'Google Pixel';
                } else {
                    deviceName = 'Android';
                }
            } else if (/Windows/.test(ua)) {
                deviceName = 'Windows PC';
            } else if (/Macintosh/.test(ua)) {
                deviceName = 'Mac';
            } else if (/Linux/.test(ua)) {
                deviceName = 'Linux PC';
            }

            return { deviceName, deviceId };
        }

        const deviceInfo = getDeviceInfo();
        let clientIP = '';
        let reconnectTimer = null;

        function connectWebSocket() {
            const ws = new WebSocket('ws://' + window.location.host + '/ws?type=mobile');

            ws.onopen = function() {
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                try {
                    ws.send(JSON.stringify({
                        type: 'connect',
                        data: {
                            type: 'mobile',
                            device_name: deviceInfo.deviceName,
                            device_id: deviceInfo.deviceId
                        },
                        timestamp: Date.now()
                    }));

                    ws.send(JSON.stringify({
                        type: 'preview',
                        data: {
                            text: '',
                            length: 0,
                            device_name: deviceInfo.deviceName,
                            device_id: deviceInfo.deviceId,
                            client_ip: clientIP
                        },
                        timestamp: Date.now()
                    }));
                } catch (e) {}
            };

            ws.onerror = function(error) {};

            ws.onclose = function(event) {
                if (!reconnectTimer) {
                    reconnectTimer = setTimeout(() => {
                        connectWebSocket();
                    }, 3000);
                }
            };

            ws.addEventListener('message', function(event) {
                const msg = JSON.parse(event.data);
                if (msg.type === 'clear') {
                    textInput.value = '';
                } else if (msg.type === 'sync') {
                    if (msg.data && msg.data.text !== undefined) {
                        const start = textInput.selectionStart;
                        const end = textInput.selectionEnd;
                        textInput.value = msg.data.text;
                        if (start <= msg.data.text.length && end <= msg.data.text.length) {
                            textInput.setSelectionRange(start, end);
                        }
                    }
                } else if (msg.type === 'connect') {
                    if (msg.data && msg.data.client_ip) {
                        clientIP = msg.data.client_ip;
                    }
                }
            });

            return ws;
        }

        let ws = connectWebSocket();

        const textInput = document.getElementById('textInput');
        const status = document.getElementById('status');
        const historyList = document.getElementById('historyList');
        const MAX_HISTORY = 20;

        window.onload = function() { renderHistory(); }

        textInput.addEventListener("input", function() {
            const text = textInput.value;
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'preview',
                    data: {
                        text: text,
                        length: text.length,
                        device_name: deviceInfo.deviceName,
                        device_id: deviceInfo.deviceId,
                        client_ip: clientIP
                    },
                    timestamp: Date.now()
                }));
            }
        });

        function handleSend() {
            const text = textInput.value.trim();
            if (!text) return;
            saveToHistory(text);
            sendRequest(text, true);
        }

        function handleClear() {
            textInput.value = '';
            textInput.focus();
        }

        function sendRequest(text, clearAfter) {
            status.innerText = "发送中...";
            status.style.color = "#888";
            fetch('/type', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    status.innerText = "✓ 已发送";
                    status.style.color = "#34c759";

                    if (typeof ws !== 'undefined' && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'history',
                            data: {
                                text: text,
                                device_name: deviceInfo.deviceName,
                                device_id: deviceInfo.deviceId,
                                client_ip: clientIP
                            },
                            timestamp: Date.now()
                        }));

                        ws.send(JSON.stringify({
                            type: 'clear',
                            data: {
                                device_id: deviceInfo.deviceId
                            },
                            timestamp: Date.now()
                        }));
                    }

                    if (clearAfter) {
                        textInput.value = '';
                    }
                    setTimeout(() => status.innerText = "", 1500);
                } else { throw new Error("Server error"); }
            })
            .catch(err => {
                status.innerText = "✕ 发送失败";
                status.style.color = "#ff3b30";
            });
        }

        function getHistory() {
            const stored = localStorage.getItem('typeHistory');
            return stored ? JSON.parse(stored) : [];
        }

        function saveToHistory(text) {
            let history = getHistory();
            history = history.filter(item => item !== text);
            history.unshift(text);
            if (history.length > MAX_HISTORY) { history = history.slice(0, MAX_HISTORY); }
            localStorage.setItem('typeHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = getHistory();
            historyList.innerHTML = '';
            history.forEach(text => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.onclick = () => {
                    textInput.value = text;
                    handleSend();
                };
                li.innerHTML = '<span class="history-text">' + escapeHtml(text) + '</span><span class="history-arrow">⤶</span>';
                historyList.appendChild(li);
            });
        }

        function clearHistory() { localStorage.removeItem('typeHistory'); renderHistory(); }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
